# =========================================================
# LOJAS NEON  |  mantem o banco acordado
#
# No plano free o projeto do Supabase pausa depois de 7 dias sem nenhum
# acesso. Se isso acontecer, o site nao quebra (cai para o catalogo de
# exemplo), mas o painel para e os precos congelam.
#
# Este agendamento le um registro do catalogo a cada dois dias. E a mesma
# leitura publica que qualquer visitante do site faz, nao altera nada.
#
# A chave abaixo e a publicavel, a mesma que ja vai dentro do site.
# A chave secreta nunca entra aqui.
# =========================================================
name: Acorda o banco

on:
  schedule:
    - cron: '17 12 */2 * *'   # 12h17 UTC, dia sim dia nao
  workflow_dispatch:           # tambem da para rodar na mao, pela aba Actions

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ler um produto do banco
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_2YRGDZ8m2QLOiAD-oVw1Uw_H2USCtLV' }}" \
            "https://xztgjjlktxyamaczurlb.supabase.co/rest/v1/produtos?select=id&limit=1")
          echo "Banco respondeu $codigo"
          if [ "$codigo" != "200" ]; then
            echo "::error::O banco nao respondeu 200. Pode estar pausado no Supabase."
            exit 1
          fi

      - uses: actions/checkout@v4

      # O GitHub desliga agendamentos em repositorio parado ha 60 dias.
      # Uma anotacao por mes basta para o repositorio nunca ficar parado.
      - name: Anotar o mes, se ainda nao foi anotado
        run: |
          mes=$(date -u +%Y-%m)
          arquivo=.github/ultimo-ping.txt
          if [ "$(cat $arquivo 2>/dev/null)" = "$mes" ]; then
            echo "Mes $mes ja anotado, nada a fazer."
            exit 0
          fi
          echo "$mes" > $arquivo
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add $arquivo
          git commit -m "Banco acordado em $mes"
          git push
